            }
            
            @keyframes move-right {
                0%   {right:0%; left:47%;}
                100% {right:-15%; left:62%}
            }

            @keyframes move-up {
                0%   {top: 100%; height:0%;}
                100% {top: 0%; height: 100%}
            }

            @keyframes contract {
                0% {width:100%; left:0%; right: 0%; border-radius: 0px; background-color: black;}
                100%   {width:34%; left:33%; right: 0%; border-radius: 15px; background-color: antiquewhite;}

            html, body {

                max-width: 100%;
                overflow-x: hidden;
            }
            
            inline {
                position: absolute;
                height: 100%;
                left: 33%;
                right: 33%;
                top: 0%;
                bottom: 0%;
                border-radius: 15px;
                width: 34%;
                z-index: 10;
            }

            profile {
                position: absolute;
                height: 90%;
                width: 100%;
                bottom: 10%;
                top: 0%;
                right: 0%;
                left: 0;
                z-index: 9;
            }

            inset{
                background-color: black;
                z-index: 6;
                width: 100%;
                height: 100%;
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
                border-top-left-radius: 25px;
                border-top-right-radius: 25px;
                border-bottom-left-radius: 0px;
                border-bottom-right-radius: 0px;
                position: absolute;
            }
            
            inset:hover {
                background-size: calc(cover + 100px);
            }

            div.profile{
                z-index: 7;
                color: white;
                position: absolute;
                height: 20%;
                top: 80%;
                border-top-left-radius: 25px;
                border-top-right-radius: 25px;
                border-bottom-left-radius: 0px;
                border-bottom-right-radius: 0px;
                margin: 5px;
            }

            div.profile > a > span {
                color: white;
            }

            span.bold, a.bold {
                font-weight: bold;
            }

            a.bold {
                color: white;
            }

            taskbar {
                border-top: 3px grey;
                border-bottom: none;
                border-right: none;
                border-left: none;
                position: absolute;
                top: 90%;
                bottom: 0%;
                left: 0%;
                right: 0%;
                height: 10%;
                background-color: white;
            }

            button {
                position: absolute;
                height: 100% ;
                width: 33%;
                padding: 5px;   
                border: none;
                background-color: transparent;
            }

            button.one {
                left: 0%;
            }

            button.two {
                left: 33.5%;
            }

            button.one {
                left: 67%;
            }

            button:hover {
                background-color: #f0f8ff;
            }

            img.icon-icon {

                height: 50%;
            }

                width: 55%;
                height: 55%;
            }

            hitbox[left] {
                width: 53%;
                height: 100%;
                position: absolute;
                left: 0%;
                right: 66%;
                top: 0%;
                bottom: 0%;
                background-color: transparent;
                z-index: 1;
            }

            hitbox[left]:hover{
                animation-timing-function: ease-in-out;
                animation-name: move-left;
                animation-duration: .4s;
                animation-fill-mode: forwards;
            }

            button[left] {
                position: absolute;
                left: 90%;
                right: 5%;
                width: 15%;
                height: 15%;
                top: 35.5%;
                bottom: 35.5%;
                z-index: 2;
                border: none;
                border-radius: 150px;
                background-color: #fffafa;
                z-index: 2;
            }

            button[left]:hover {
                box-shadow: 0px 0px 5px #ff0000;
            }

            hitbox[right] {
                width: 53%;
                height: 100%;
                position: absolute;
                right: 0%;
                left: 47%;
                top: 0%;
                bottom: 0%;
                background-color: transparent;
                z-index: 1;
            }

            hitbox[right]:hover{
                animation-timing-function: ease-in-out;
                animation-name: move-right;
                animation-duration: .4s;
                animation-fill-mode: forwards;
            }

            button[right] {
                position: absolute;
                right: 90%;
                left: 5%;
                width: 15%;
                height: 15%;
                top: 35.5%;
                bottom: 35.5%;
                z-index: 2;
                border: none;
                border-radius: 150px;
                background-color: #fffafa;
                z-index: 2;
            }

            button[right]:hover {
                box-shadow: 0px 0px 5px #00ff00;
            }

            .animate {
                animation-timing-function: ease-in-out;
                animation-name: contract;
                animation-duration: 1s;
                animation-fill-mode: forwards;
            }

            .ribbon {
                width: fit-content;
                height: 10px;
                font-size: 9px;
                padding: 4px;
                left: 57%;
                top: 5%;
                position: absolute;
                text-align: center;
                border-radius: 25px;
                transform: rotate(20deg);
                background-color: #ff0000;
                color: white;
                display: none;

                color: white;
                display: none;

            }

            .closeUp {

                border-radius: 100px;
                border: 7px solid whitesmoke;
                z-index: 3;
                top: -50%;
                left: 5%;

            }

            .banner-container {

                height: 30%;

                width: 100%;
                z-index: 0;
                height: 100%;

                left: 40%;

            }
            
            .banner-container > span {
                top: -110%;
                left: 40%;
                position: relative;
            }

            inset[secondary] {
                background-color: whitesmoke;
            }

            inset[secondary]:not(.animate-up) * {
                display: none;
            }

            inset[secondary]:not(.animate-up) {
                display: none;
                top:100%;
                height: 0%;
            }

            inset[secondary].animate-up {
                display: visible;
                animation-timing-function: ease-in-out;
                animation-name: move-up;
                animation-duration: 1s;
                animation-fill-mode: forwards;
            }

            div.tags > span {
                color: #91672F;
                font-family: Arial, Helvetica, sans-serif;
            }

            div.tags > span:not(.block) {
                border-radius: 10px;
                border: 1px solid #91672F;
                margin-left: 5px;
                padding-left: 5px;
                padding-right: 5px;
            }

            .scroll-box {
                overflow-y: auto;
                overflow-x: hidden;
                max-height: 50vh;
                width: 100%;
                position: sticky;
            }

            .scroll-box * {
                overflow-wrap: break-word;
            }

            .scroll-box > .section {
                margin: 5px;
            }

            .italics {
                left: 5%;
                position: relative;
                font-family: 'Times New Roman', Times, serif;
                font-style: italic;
            }
            
            .section > div {
                width: 90%;
                left: 5%;
                border: 1px solid lightgrey;
                position: relative;
            }

            .cross-button {
                top: -200%;
                position: relative;
                width: 10%;
                aspect-ratio: 1 / 1;
                right: -75%;
                filter: invert(.5) brightness(2);
            }

            .cross-button:hover {
                filter: invert(.5);
            }

            .tooltip {
                position: relative;
                display: inline-block;
                border-bottom: 1px dotted black; 
                cursor: pointer;
            }

            .tooltiptext {
                visibility: hidden; 
                width: 130px;
                background-color: black;
                color: #ffffff;
                text-align: center;
                padding: 5px 0;
                border-radius: 6px;
                position: absolute;
                z-index: 1; 
            }

            .tooltip:hover .tooltiptext {
                visibility: visible;
            }

            .tooltiptext::after {
                content: " ";
                position: absolute;
                top: 50%;
                right: 100%;
                margin-top: -5px;
                border-width: 5px;
                border-style: solid;
                border-color: transparent black transparent transparent;
            }
            
            @media (min-width: 380px) {
                .text-ws {
                    width: 50%;
                }
            }

            @media (max-width: 800px) {
                .cross-button {
                    right: -65%;
                }

                inline{
                    width: 100%;
                    border-radius: 0px;
                    left: 0%;
                    right: 0%;
                }

                inset{
                    width: 100%;
                    border-radius: 0px;
                }

                @keyframes contract {
                    0% {width:110%; left:-5%; right: -5%;}
                    100%   {width:100%; left: 0%; right: 0%; }
                }

                hitbox[left] {
                    z-index: 12;
                    width: 33%;
                    left: 0%;
                    right: 66%;
                    height: 90%;
                    bottom: 10%;
                    top: 0%;
                }

                button[left], button[right] {
                    background-color: transparent;
                    width: 100%;
                    height: 100%;
                    color: #ffffff;
                    top: 0%;
                    left: 0%;
                    right: 0%;
                    bottom: 0%;
                    border-radius: 0px;
                    z-index: inherit;

                    box-shadow: none;
                }

                hitbox[left]:hover {
                    background-color: rgba(255, 0, 0, 0.61);
                    box-shadow: 0px 0px 5px #ff0000;
                }

                hitbox[right] {
                    z-index: 12;
                    width: 33%;
                    right: 0%;
                    left: 66%;
                    height: 90%;
                    bottom: 10%;
                    top: 0%;
                }

                hitbox[right]:hover {
                    background-color: rgba(0, 255, 0, 0.61);
                    box-shadow: 0px 0px 5px #00ff00;
                }
                
                .auxillary {
                    width: 25%; 
                    height: 25%;
                }

                @keyframes move-right {
                    0%   {left:66%; width: 33%;}
                    100% {left:86%; width: 14%;}
                }
                @keyframes move-left {
                    0%   {right:66%; width: 33%;}
                    100% {right:86%; width: 14%;}
                }

            }

            @media (max-width: 500px) {
                span, p {
                    font-size: large;
                }
            }
        </style>
    </head>
